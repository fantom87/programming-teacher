# slugkit — turn any title into a URL slug.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slugkit"
version = "0.3.0"
description = "turn any title into a URL slug"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.0"]

[project.scripts]
slugkit = "slugkit.cli:main"
