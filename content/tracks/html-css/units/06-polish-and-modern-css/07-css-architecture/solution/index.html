<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Harbor Film Festival</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Reel Harbor Film Festival</h1>
    <p class="lede">Three nights, one projector, no reruns.</p>
    <section class="cards">
      <article class="screening screening--featured">
        <h2 class="screening__title">Opening night: The Lighthouse Reel</h2>
        <p class="screening__when">Friday 7pm — Pier House</p>
      </article>
      <article class="screening">
        <h2 class="screening__title">Shorts under the stars</h2>
        <p class="screening__when">Saturday 9pm — North Beach</p>
      </article>
      <article class="screening">
        <h2 class="screening__title">Closing: Harbor Lights</h2>
        <p class="screening__when">Sunday 6pm — Pier House</p>
      </article>
    </section>
  </main>
</body>
</html>
