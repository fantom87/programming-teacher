<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Darkroom Wall</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>The darkroom wall</h1>
    <p>Prints from the harbor walk. Straighten nothing.</p>
    <div class="wall">
      <figure class="polaroid tilt-left">
        <div class="photo photo-harbor"></div>
        <figcaption>Fog over the pier</figcaption>
      </figure>
      <figure class="polaroid tilt-right">
        <div class="photo photo-gulls"></div>
        <figcaption>Gulls, arguing</figcaption>
      </figure>
      <figure class="polaroid tilt-left">
        <div class="photo photo-rope"></div>
        <figcaption>Rope, coiled</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
