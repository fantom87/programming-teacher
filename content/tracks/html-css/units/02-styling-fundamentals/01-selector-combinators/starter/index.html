<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tide Pool Field Guide</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Tide Pool Field Guide</h1>
    <main>
      <p>Notes from a morning at the north jetty, tide out, boots soaked.</p>
      <div class="card">
        <h2>Ochre Sea Star</h2>
        <p>Purple or orange, wedged into crevices. Moves slower than the tide it hunts in.</p>
      </div>
      <div class="card">
        <h2>Green Anemone</h2>
        <p>Looks like a flower, stings like a jellyfish. Closes into a blob when the water drops.</p>
      </div>
    </main>
  </body>
</html>
