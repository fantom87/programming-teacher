<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Sticky Note Board</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Sticky Note Board</h1>
    <p>Three notes, three <span class="tag">divs</span> — watch how the
    browser lays them out before you change a thing.</p>

    <div class="note">
      <strong>Buy flour</strong>
      <p>The bread experiment continues this weekend.</p>
    </div>
    <div class="note">
      <strong>Water the ferns</strong>
      <p>They droop dramatically when ignored.</p>
    </div>
    <div class="note">
      <strong>Learn CSS layout</strong>
      <p>Apparently it starts with something called normal flow.</p>
    </div>
  </body>
</html>
