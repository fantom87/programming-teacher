<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Whisker Lodge — Adopt</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>Whisker Lodge Adoption Application</h1>
      <p>Tell us a little about yourself and we'll match you with a cat who
        will tolerate you beautifully.</p>
      <form class="apply">
        <p>Your name</p>
        <input type="text">
        <input type="text" placeholder="Email address">
        <p>Your home</p>
        <p><input type="radio" name="home"> Apartment</p>
        <p><input type="radio" name="home"> House</p>
        <div class="btn">Send application</div>
      </form>
    </main>
  </body>
</html>
