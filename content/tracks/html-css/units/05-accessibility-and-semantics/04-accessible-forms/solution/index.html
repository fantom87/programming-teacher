<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Whisker Lodge — Adopt</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>Whisker Lodge Adoption Application</h1>
      <p>Tell us a little about yourself and we'll match you with a cat who
        will tolerate you beautifully.</p>
      <form class="apply">
        <p>
          <label for="name">Your name</label>
          <input type="text" id="name" name="name">
        </p>
        <p>
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
        </p>
        <fieldset>
          <legend>Your home</legend>
          <p>
            <input type="radio" id="home-apartment" name="home" value="apartment">
            <label for="home-apartment">Apartment</label>
          </p>
          <p>
            <input type="radio" id="home-house" name="home" value="house">
            <label for="home-house">House</label>
          </p>
        </fieldset>
        <button type="submit" class="btn">Send application</button>
      </form>
    </main>
  </body>
</html>
