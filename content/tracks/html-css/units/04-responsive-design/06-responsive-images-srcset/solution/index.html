<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Harbor Light — Photo of the Week</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="feature">
      <h1>Photo of the week</h1>
      <figure class="photo">
        <img src="harbor-960.jpg"
             srcset="harbor-480.jpg 480w, harbor-960.jpg 960w, harbor-1600.jpg 1600w"
             sizes="(min-width: 800px) 640px, 100vw"
             alt="Fishing boats moored in a glassy harbor at sunrise, fog lifting off the water">
        <figcaption>First light over the harbor, October.</figcaption>
      </figure>
      <p>Shot from the sea wall at 6:40 am, about ten minutes before the fog gave up. The stillness lasted exactly as long as the coffee did.</p>
    </main>
  </body>
